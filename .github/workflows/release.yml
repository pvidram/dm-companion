name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "value=0.0.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"; fi
      # El script usa `python3`; setup-python en Windows solo garantiza `python`.
      # Se comprueba con --version porque el alias de la Store también responde a `command -v`.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: python3 shim
        shell: bash
        run: |
          if ! python3 --version >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/shim"
            printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/shim/python3"
            chmod +x "$RUNNER_TEMP/shim/python3"
            echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
          fi
      - name: Publish and zip
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: scripts/publish-desktop.sh win-x64 "$VERSION"
      - name: Installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:PATH = "$inno;$env:PATH"
          }
          iscc installer\dm-companion.iss "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\win-x64\app" "/DOutputDir=$PWD\dist"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "value=0.0.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"; fi
      - name: appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Publish and AppImage
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" scripts/publish-desktop.sh linux-x64 "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft "${flags[@]}" --generate-notes --title "DM Companion ${GITHUB_REF_NAME#v}"
